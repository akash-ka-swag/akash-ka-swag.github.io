<!DOCTYPE html>
<html>
<head>
    <title>Akash Ka Swag | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff; 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
           .profile-pic {
       width: 120px;
       height: 120px;
       margin: 0 auto 20px;
       border-radius: 50%;
       border: 3px solid #00ff88;
       object-fit: cover;
       display: block;
       box-shadow: 0 0 20px #00ff88;
           }
            
        }
        h1 { 
            font-size: 45px; 
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff88;
        }
        .tagline { 
            font-size: 18px; 
            color: #aaa; 
            margin-bottom: 30px;
        }
        .swag-line {
         background: #00ff88;
         color: #000;
         padding: 15px;
         border-radius: 10px;
         margin: 20px 0;
         font-weight: bold;
         text-align: center;
         box-shadow: 0 0 15px #00ff88;
        }
        
        .social-links {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.social-links a {
  background: #00ff88;
  color: #000;
  padding: 12px 20px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.social-links a:hover {
  box-shadow: 0 0 15px #00ff88;
  transform: scale(1.05);
}
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
            <img src="akash.jpg" class="profile-pic" alt="Akash">
        <h1>AKASH KA SWAG</h1>
        <p class="tagline"> jo kaho vo karo jarur |KANPUR,UP 🌹💻</p>
        
        <div class="swag-line">
            King of my own world💪<br>
            Hustle, Loyality, Respect 🔥
        </div>
        
        <div class="social-links">
            <a href="https://instagram.com/kingyadavansi2092" target="_blank">Instagram</a>
            <a href="https://youtube.com/@akashwebdev" target="_blank">YouTube</a>
            <a href="https://github.com/akash-ka-swag" target="_blank">GitHub</a>
        </div>
        <button onclick="badalDe()" style="background:#00ff88; color:#000; padding:15px 30px; border:none; border-radius:8px; font-weight:bold; margin:20px; cursor:pointer;">Magic Button 💥</button>
<div style="max-width:400px; margin:30px auto; padding:20px; background:#1f1f1f; border-radius:10px; border:1px solid #00ff88;">
  <h3 style="text-align:center; color:#00ff88;">Contact Me</h3>
  <input type="text" id="name" placeholder="Apna Naam" style="width:100%; padding:10px; margin:8px 0; border:1px solid #00ff88; border-radius:5px; background:#0a0a0a; color:white;">
  <input type="text" id="message" placeholder="Message likho..." style="width:100%; padding:10px; margin:8px 0; border:1px solid #00ff88; border-radius:5px; background:#0a0a0a; color:white;">
  
  <button type="button" onclick="sendToWhatsApp()" style="width:100%; padding:12px; background:#00ff88; color:#000; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
  Send on WhatsApp
 </button>
</div>
        <p class="footer">Made with 💚 by Akash | akash-ka-swag.github.io</p>
    </div>
<!-- Music Player -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()" style="position:fixed; bottom:20px; right:20px; padding:12px 18px; border:none; border-radius:50px; background:#ff0050; color:white; font-weight:bold; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.3);">
  ▶️ Play
</button>

<script>
function toggleMusic() {
  var music = document.getElementById("bgMusic");
  var btn = document.getElementById("musicBtn");
  if (music.paused) {
    music.play();
    btn.innerHTML = "⏸️ Pause";
  } else {
    music.pause();
    btn.innerHTML = "▶️ Play";
  }
}

function sendToWhatsApp() {
  let name = document.getElementById("name").value;
  let message = document.getElementById("message").value;
  let number = "919580173772";
  
  if(name == "" || message == ""){
    alert("Bhai naam aur message dono bharna padega");
    return;
  }
  
  let url = "https://wa.me/" + number + "?text=" 
    + "Name: " + name + "%0a" 
    + "Message: " + message + "%0a%0a" 
    + "Sent from akash-ka-swag.github.io";
  
  // YE LINE CHANGE KI HAI - window.open KI JAGAH
  window.location.href = url;
}
</script>


<script>
function badalDe() {
document.querySelector('.swag-line').innerHTML = "AKASH BHAI OP 🔥<br>JS Master Loading... 💻";
}
</script>
</body>
</html>
