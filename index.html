<!DOCTYPE html>
<html>
<head>
    <title>Akash Ka Swag | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff; 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
           .profile-pic {
       width: 120px;
       height: 120px;
       margin: 0 auto 20px;
       border-radius: 50%;
       border: 3px solid #00ff88;
       object-fit: cover;
       display: block;
       box-shadow: 0 0 20px #00ff88;
           }
            
        }
        h1 { 
            font-size: 45px; 
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff88;
        }
        .tagline { 
            font-size: 18px; 
            color: #aaa; 
            margin-bottom: 30px;
        }
        .swag-line {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #00ff88;
            margin-bottom: 30px;
        }
        .social-links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .social-links a:hover {
            background: #fff;
            transform: scale(1.1);
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
            <img src="akash.jpg" class="profile-pic" alt="Akash">
        <h1>AKASH KA SWAG</h1>
        <p class="tagline"> jo kaho vo karo jarur |KANPUR,UP 🌹💻</p>
        
        <div class="swag-line">
            King of my own world💪<br>
            Hustle, Loyality, Respect 🔥
        </div>
        
        <div class="social-links">
            <a href="https://instagram.com/kingyadavansi2092" target="_blank">Instagram</a>
            <a href="https://youtube.com/@akashwebdev target="_blank">YouTube</a>
            <a href="https://github.com/akash-ka-swag" target="_blank">GitHub</a>
        </div>
        
        <p class="footer">Made with 💚 by Akash | akash-ka-swag.github.io</p>
    </div>
</body>
</html>
